services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-discorddrive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-discorddrive}
      POSTGRES_DB: ${POSTGRES_DB:-discorddrive}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-discorddrive} -d ${POSTGRES_DB:-discorddrive}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    # Not published to the host: only the API needs it, and a published port is an
    # easy way to end up with a wide-open database on a laptop or VPS.
    expose:
      - '5432'

  api:
    build:
      context: ./apps/api
      target: runtime
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: '4000'
      DATABASE_URL: postgres://${POSTGRES_USER:-discorddrive}:${POSTGRES_PASSWORD:-discorddrive}@db:5432/${POSTGRES_DB:-discorddrive}
      UPLOAD_TMP_DIR: /tmp/discorddrive
    expose:
      - '4000'
    # A hard memory ceiling is what keeps the streaming promise honest: if a code path
    # ever buffers a whole file, the container dies instead of the host swapping.
    mem_limit: 1024m
    tmpfs:
      # Chunk scratch space lives in RAM and is capped, so uploads can never fill the
      # host disk. It is additionally swept by the janitor on every boot.
      - /tmp/discorddrive:size=512m,mode=1777

  web:
    build:
      context: ./apps/web
      target: runtime
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-8080}:80'

volumes:
  pgdata:

# Serves the built SPA and proxies the API on the same origin, which is what lets
# the session cookie stay httpOnly + SameSite=Lax with no CORS configuration.

upstream discorddrive_api {
    server api:4000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Multi-gigabyte uploads and downloads need a ceiling far above the 8 MiB chunk.
    client_max_body_size 64m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Hashed build assets are immutable; the HTML shell must never be cached.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /api/ {
        proxy_pass http://discorddrive_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Downloads stream straight through. Buffering would defeat the whole point
        # of the reassembly endpoint and stall the browser.
        proxy_buffering off;
        proxy_request_buffering off;

        # A 1 GB download over a slow link outlives any sane default.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Surface upstream failures as-is rather than nginx's generic 502 page.
        proxy_intercept_errors off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }
}
